name: Build tvhome APK (CleanYourTV)

on:
  workflow_dispatch: # 仅手动触发，最稳
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x launcher/gradlew

      - name: Build tvhome release (原版项目打包方式)
        working-directory: ./launcher
        run: ./gradlew assembleRelease

      - name: List output dir（调试用，看有没有apk）
        run: ls -la launcher/build/outputs/apk/release/

      - name: Upload tvhome.apk
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/build/outputs/apk/release/launcher-release-unsigned.apk
          retention-days: 90


name: Build tvhome APK (CleanYourTV)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # ✅ 支持网页手动点 Run workflow，推荐用这个

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher # tvhome 源码在 launcher 文件夹
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload tvhome.apk
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/build/outputs/apk/debug/launcher-debug.apk
          retention-days: 90

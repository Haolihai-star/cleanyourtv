name: Build tvhome APK (CleanYourTV)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Enter launcher and run original build script
        run: |
          cd launcher
          chmod +x build-and-install.sh
          ./build-and-install.sh
        env:
          # 告诉脚本：不要尝试adb安装（github机器没有adb连电视）
          SKIP_ADB_INSTALL: true

      - name: Find generated apk
        run: find launcher -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/*.apk
          retention-days: 90

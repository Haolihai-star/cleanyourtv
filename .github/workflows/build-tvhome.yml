name: Build tvhome APK (CleanYourTV)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Create gradle init script for aliyun mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          daemon: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

      - name: Build Release
        working-directory: ./launcher
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Find generated apk
        run: find launcher -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/build/outputs/apk/release/launcher-release-unsigned.apk
          retention-days: 90

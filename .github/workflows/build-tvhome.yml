name: Build tvhome APK (CleanYourTV)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x launcher/gradlew

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('launcher/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Replace maven repo (换成阿里云，解决github拉google依赖超时失败)
        run: |
          sed -i 's|https://maven.google.com|https://maven.aliyun.com/repository/google|g' launcher/build.gradle
          sed -i 's|https://repo1.maven.org/maven2|https://maven.aliyun.com/repository/public|g' launcher/build.gradle

      - name: Clean + Build Debug（先从debug包试，成功率更高）
        working-directory: ./launcher
        run: |
          ./gradlew clean
          ./gradlew assembleDebug
        continue-on-error: false

      - name: Debug list all files
        run: find launcher/build -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/build/outputs/apk/debug/launcher-debug.apk
          retention-days: 90
